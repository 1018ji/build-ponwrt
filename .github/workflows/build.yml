name: Build

on:
  workflow_call:
    inputs:
      cache_mode:
        description: 使用缓存 / 只读缓存 / 重新编译 / 不使用缓存
        type: string
        default: 使用缓存
      commit:
        description: 编译的 ponwrt commit，留空使用分支最新版本
        type: string
        default: ''
      ssh:
        description: 编译前开启 SSH 会话
        type: boolean
        default: false
      artifact_prefix:
        description: 固件 artifact 名称为 前缀-日期-机型
        type: string
        required: true
      retention_days:
        type: number
        default: 1

env:
  REPO_URL: https://github.com/1018ji/ponwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai
  # 使用缓存：恢复并保存；只读缓存：只恢复不上传；重新编译：从空缓存编译并保存；不使用缓存：全部关闭
  CACHE_MODE: ${{ inputs.cache_mode }}
  # ccache 默认按编译器文件的修改时间判断编译器是否变化，工具链重新编译后会全部不命中，改为按版本判断
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_MAXSIZE: 3G
  GH_REPO: ${{ github.repository }}

# 流程：prepare → 固件
# prepare 拉取源码和 feeds 后打包传给固件 job，保证两个机型编译的源码完全一致
jobs:
  prepare:
    runs-on: ubuntu-22.04

    steps:
    - &checkout
      name: Checkout
      uses: actions/checkout@v7

    - &init
      name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 编译 job 需要腾出磁盘空间，放到后台和 apt 安装同时进行；prepare 用不到这么多空间，跳过
        if [ "$FREE_DISK" = true ]; then
          sudo sh -c 'rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; docker image prune --all --force > /dev/null' &
        fi
        # 跳过 man-db 触发器，安装时不重建手册索引
        sudo rm -f /var/lib/man-db/auto-update
        sudo rm -rf /etc/apt/sources.list.d/*
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq clean
        wait
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      env:
        COMMIT: ${{ inputs.commit }}
      run: |
        df -hT $PWD
        # 不下载历史版本的文件内容，源码包更小；提交记录完整保留，固件版本号不受影响
        git clone --filter=blob:none $REPO_URL -b $REPO_BRANCH openwrt
        # 固定为调用方指定的 commit，保证编译的版本与发布说明一致
        [ -z "$COMMIT" ] || git -C openwrt checkout -q "$COMMIT"
        # tools 的 .prepared 标记文件名里带源码文件的修改时间，固定时间后缓存的工具链才能被识别
        find openwrt/tools openwrt/toolchain -exec touch -h -d @1600000000 {} +
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        [ -e files ] && mv files openwrt/files
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    # feeds 跟随各自分支最新版本，每个 job 单独拉取可能不一致，统一打包传下去
    - name: Pack source code
      working-directory: /workdir
      run: |
        tar -I 'zstd -T0' -cf source.tar.zst openwrt
        ls -lh source.tar.zst

    - name: Upload source code
      uses: actions/upload-artifact@v7
      with:
        name: source
        path: /workdir/source.tar.zst
        retention-days: 1
        compression-level: 0
        overwrite: true

    # 缓存在 clone 之后恢复，否则目录非空会导致 git clone 失败
    - &dl
      name: Restore download cache
      id: dl-cache
      if: env.CACHE_MODE != '不使用缓存'
      uses: actions/cache/restore@v6
      with:
        path: /workdir/openwrt/dl
        key: openwrt-dl-
        restore-keys: |
          openwrt-dl-

    # 两个机型一起下载，dl 缓存只在这里保存一份；源码已经打包，这里改动不影响固件 job
    - name: Download package
      id: package
      run: |
        cd openwrt
        for CONFIG in an7581.config an7583.config; do
          $GITHUB_WORKSPACE/.github/scripts/load-config.sh $CONFIG
          make download -j$(nproc)
        done
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        echo "dl_key=openwrt-dl-$(find dl -type f -printf '%P %s\n' | LC_ALL=C sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    # key 按 dl 文件列表计算，没有新下载的文件时跳过上传
    - name: Save download cache
      if: (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译') && steps.package.outputs.dl_key != steps.dl-cache.outputs.cache-matched-key
      uses: actions/cache/save@v6
      with:
        path: /workdir/openwrt/dl
        key: ${{ steps.package.outputs.dl_key }}

    - name: Remove old download caches
      if: always() && (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译')
      env:
        GH_TOKEN: ${{ github.token }}
      run: .github/scripts/prune-cache.sh openwrt-dl-

  firmware:
    name: 固件
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [an7581, an7583]
    env:
      CONFIG_FILE: ${{ matrix.target }}.config
      FREE_DISK: true

    steps:
    - *checkout
    - *init

    - name: Download source code
      uses: actions/download-artifact@v8
      with:
        name: source
        path: /workdir

    - name: Extract source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        tar -I zstd -xf source.tar.zst
        rm -f source.tar.zst
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - *dl

    - name: Restore compiler cache
      if: env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '只读缓存'
      uses: actions/cache/restore@v6
      with:
        path: /workdir/openwrt/.ccache
        key: openwrt-ccache-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          openwrt-ccache-${{ matrix.target }}-

    - name: Load custom configuration
      run: cd openwrt && $GITHUB_WORKSPACE/.github/scripts/load-config.sh $CONFIG_FILE

    - name: Setup SSH session
      if: inputs.ssh
      uses: owenthereal/action-upterm@v2
      with:
        detached: true
        limit-access-to-actor: true

    # 使用缓存 / 重新编译时 prepare 已经把两个机型的源码包下全并存入 dl 缓存，这里跳过；
    # 万一缺文件，编译时 make 也会自动下载
    - name: Download package
      if: env.CACHE_MODE == '只读缓存' || env.CACHE_MODE == '不使用缓存'
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # 工具链缓存：key 由 tools / toolchain / include 等源码和工具链相关配置算出，只接受完全匹配，源码一变就重新编译
    - name: Compute toolchain cache key
      id: toolchain
      run: |
        cd openwrt
        BOARD=$(sed -n 's/^CONFIG_TARGET_BOARD="\(.*\)"$/\1/p' .config)
        SUBTARGET=$(sed -n 's/^CONFIG_TARGET_SUBTARGET="\(.*\)"$/\1/p' .config)
        HASH=$({
          git rev-parse HEAD:tools HEAD:toolchain HEAD:include HEAD:rules.mk "HEAD:target/linux/$BOARD/Makefile"
          git rev-parse "HEAD:target/linux/$BOARD/$SUBTARGET/target.mk" 2>/dev/null || true
          grep -E '^CONFIG_(ARCH|TARGET_ARCH_PACKAGES|CPU_TYPE|TARGET_OPTIMIZATION|EXTRA_OPTIMIZATION|SOFT_FLOAT|GCC_|BINUTILS_|LIBC|MUSL|GLIBC|TOOLCHAIN|EXTERNAL_TOOLCHAIN|USE_|CCACHE|DEVEL|INSTALL_|GDB|SSP_|BUILD_NLS)' .config
        } | sha256sum | cut -c1-16)
        echo "key=openwrt-toolchain-${{ matrix.target }}-$HASH" >> "$GITHUB_OUTPUT"

    - name: Restore toolchain cache
      id: toolchain-cache
      if: env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '只读缓存'
      uses: actions/cache/restore@v6
      with:
        path: &toolchain-path |
          /workdir/openwrt/staging_dir/host
          /workdir/openwrt/staging_dir/toolchain-*
          /workdir/openwrt/build_dir/host
          /workdir/openwrt/build_dir/toolchain-*
        key: ${{ steps.toolchain.outputs.key }}

    # 没有缓存时先单独编译工具链并保存，固件编译失败也不影响下次复用
    - name: Compile tools and toolchain
      id: toolchain-build
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      run: |
        cd openwrt
        make -j$(nproc) tools/install toolchain/install || make -j1 V=s tools/install toolchain/install

    - name: Remove stale toolchain cache
      if: steps.toolchain-build.outcome == 'success' && env.CACHE_MODE == '重新编译'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh cache delete "${{ steps.toolchain.outputs.key }}" || true

    - name: Save toolchain cache
      if: steps.toolchain-build.outcome == 'success' && (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译')
      uses: actions/cache/save@v6
      with:
        path: *toolchain-path
        key: ${{ steps.toolchain.outputs.key }}

    - name: Remove old toolchain caches
      if: always() && (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译')
      env:
        GH_TOKEN: ${{ github.token }}
      run: .github/scripts/prune-cache.sh "openwrt-toolchain-${{ matrix.target }}-"

    - name: Compile the firmware
      id: compile
      env:
        TOOLCHAIN_RESTORED: ${{ steps.toolchain-cache.outputs.cache-hit }}
      run: |
        cd openwrt
        # 恢复的文件统一刷新为当前时间，避免比本次新生成的 .config 等文件旧而触发重新编译
        if [ "$TOOLCHAIN_RESTORED" = true ]; then
          find staging_dir/host staging_dir/toolchain-* build_dir/host build_dir/toolchain-* -exec touch -h -d "@$(date +%s)" {} +
        fi
        # 清零恢复来的统计数据，编译后显示的命中率只反映本次
        [ -x staging_dir/host/bin/ccache ] && CCACHE_DIR=$PWD/.ccache staging_dir/host/bin/ccache -z || true
        echo -e "$(nproc) thread compile"
        # 失败时单线程重跑一次输出详细日志，不再多跑一遍，避免超过 6 小时上限
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Show compiler cache statistics
      if: always() && steps.compile.outcome != 'skipped' && env.CACHE_MODE != '不使用缓存'
      run: |
        [ -x openwrt/staging_dir/host/bin/ccache ] && CCACHE_DIR=/workdir/openwrt/.ccache openwrt/staging_dir/host/bin/ccache -s || true

    # 编译失败也保存，下次重试可以复用；编译步骤没运行时不保存，避免空缓存覆盖
    - name: Save compiler cache
      if: always() && steps.compile.outcome != 'skipped' && (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译')
      uses: actions/cache/save@v6
      with:
        path: /workdir/openwrt/.ccache
        key: openwrt-ccache-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Remove old compiler caches
      if: always() && (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译')
      env:
        GH_TOKEN: ${{ github.token }}
      run: .github/scripts/prune-cache.sh "openwrt-ccache-${{ matrix.target }}-"

    - name: Generate artifact name
      id: name
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: echo "name=${{ inputs.artifact_prefix }}-$(date +%Y-%m-%d)-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

    - name: Upload firmware
      if: steps.name.outputs.name != '' && !cancelled()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.name.outputs.name }}
        retention-days: ${{ inputs.retention_days }}
        if-no-files-found: error
        overwrite: true
        path: |
          openwrt/bin/targets/airoha/${{ matrix.target }}/*initramfs-recovery.itb
          openwrt/bin/targets/airoha/${{ matrix.target }}/*squashfs-sysupgrade.itb
