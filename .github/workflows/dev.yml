name: DEV Builder

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 编译前开启 SSH 调试会话
        type: boolean
        default: false
      cache:
        description: 编译缓存
        type: choice
        required: false
        default: 使用缓存
        options:
          - 使用缓存
          - 只读缓存
          - 重新编译
          - 不使用缓存

env:
  REPO_URL: https://github.com/1018ji/ponwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai
  # 使用缓存：恢复并保存；只读缓存：只恢复不上传；重新编译：从空缓存编译并保存；不使用缓存：全部关闭
  # 定时或外部触发没有选项，按“使用缓存”处理
  CACHE_MODE: ${{ inputs.cache || '使用缓存' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [an7581, an7583]
    env:
      CONFIG_FILE: ${{ matrix.target }}.config

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # 缓存在 clone 之后恢复，否则目录非空会导致 git clone 失败
    - name: Restore download cache
      if: env.CACHE_MODE != '不使用缓存'
      uses: actions/cache/restore@v4
      with:
        path: /workdir/openwrt/dl
        key: openwrt-dl-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          openwrt-dl-${{ matrix.target }}-

    - name: Restore compiler cache
      if: env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '只读缓存'
      uses: actions/cache/restore@v4
      with:
        path: /workdir/openwrt/.ccache
        key: openwrt-ccache-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          openwrt-ccache-${{ matrix.target }}-

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        if [ "$CACHE_MODE" != "不使用缓存" ]; then
          sed -i '/^CONFIG_DEVEL=/d; /^# CONFIG_DEVEL is not set$/d; /^CONFIG_CCACHE=/d; /^# CONFIG_CCACHE is not set$/d' .config
          printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
        fi

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Setup SSH session
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.ssh }}
      uses: owenthereal/action-upterm@v2
      with:
        detached: true
        limit-access-to-actor: true

    - name: Compile the firmware
      id: compile
      env:
        CCACHE_MAXSIZE: 3G
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Show compiler cache statistics
      if: always() && steps.compile.outcome != 'skipped' && env.CACHE_MODE != '不使用缓存'
      run: |
        [ -x openwrt/staging_dir/host/bin/ccache ] && CCACHE_DIR=/workdir/openwrt/.ccache openwrt/staging_dir/host/bin/ccache -s || true

    # 编译失败也保存，下次重试可以复用；编译步骤没运行时不保存，避免空缓存覆盖
    - name: Save compiler cache
      if: always() && steps.compile.outcome != 'skipped' && (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译')
      uses: actions/cache/save@v4
      with:
        path: /workdir/openwrt/.ccache
        key: openwrt-ccache-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Save download cache
      if: always() && steps.compile.outcome != 'skipped' && (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译')
      uses: actions/cache/save@v4
      with:
        path: /workdir/openwrt/dl
        key: openwrt-dl-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Generate artifact name
      id: name
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: echo "name=DEV-$(date +%Y-%m-%d)-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      if: steps.name.outputs.name != '' && !cancelled()
      with:
        name: ${{ steps.name.outputs.name }}
        retention-days: 3
        if-no-files-found: error
        path: |
          openwrt/bin/targets/airoha/${{ matrix.target }}/*initramfs-recovery.itb
          openwrt/bin/targets/airoha/${{ matrix.target }}/*squashfs-sysupgrade.itb

  cleanup:
    needs: [build]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      actions: write

    steps:
    - name: Keep latest 7 workflow runs
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh run list --workflow "${{ github.workflow }}" --status completed --limit 200 --json databaseId,createdAt \
          --jq 'sort_by(.createdAt) | reverse | .[6:] | .[].databaseId' |
        while read -r ID; do
          echo "deleting workflow run $ID"
          gh run delete "$ID"
        done
