name: RELEASE Builder

on:
  schedule:
    - cron: '0 21 * * *'  # UTC 21:00 = 北京时间 05:00
  workflow_dispatch:

env:
  REPO_URL: https://github.com/1018ji/ponwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
    - name: Create draft release
      id: tag
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        COMMIT=$(git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | cut -f1)
        [ -n "$COMMIT" ] || { echo "failed to resolve $REPO_URL $REPO_BRANCH"; exit 1; }
        LAST_TAG=$(gh release list --limit 200 --json tagName,name,isDraft,createdAt \
          --jq '[.[] | select(.isDraft | not) | select(.name | startswith("RELEASE-"))] | sort_by(.createdAt) | last | .tagName // empty')
        if [ -n "$LAST_TAG" ]; then
          LAST_COMMIT=$(gh release view "$LAST_TAG" --json body --jq .body | grep -oE '[0-9a-f]{40}' | head -n1)
          if [ "$LAST_COMMIT" = "$COMMIT" ]; then
            echo "ponwrt $COMMIT already released in $LAST_TAG, skip build"
            exit 0
          fi
        fi
        TAG="$(TZ="$TZ" date +%Y-%m-%d-%H-%M-%S)"
        TITLE="RELEASE-$(TZ="$TZ" date +%Y-%m-%d)"
        NOTES="ponwrt: ${REPO_URL}/commit/${COMMIT}"
        gh release create "$TAG" --draft --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [an7581, an7583]
    env:
      CONFIG_FILE: ${{ matrix.target }}.config

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload firmware to release
      if: steps.compile.outputs.status == 'success' && !cancelled()
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        shopt -s nullglob
        FILES=(openwrt/bin/targets/airoha/${{ matrix.target }}/*initramfs-recovery.itb
               openwrt/bin/targets/airoha/${{ matrix.target }}/*squashfs-sysupgrade.itb)
        [ ${#FILES[@]} -gt 0 ] || { echo "no firmware found"; exit 1; }
        gh release upload "${{ needs.prepare.outputs.tag }}" "${FILES[@]}"

  publish:
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.tag != ''
    runs-on: ubuntu-22.04

    steps:
    - name: Publish or discard release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ needs.prepare.outputs.tag }}
      run: |
        COUNT=$(gh release view "$TAG" --json assets --jq '.assets | length')
        if [ "$COUNT" -gt 0 ]; then
          gh release edit "$TAG" --draft=false
        else
          echo "no firmware uploaded, deleting draft release"
          gh release delete "$TAG" --yes
          exit 1
        fi

    - name: Keep latest 7 releases
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh release list --limit 200 --json tagName,name,isDraft,createdAt \
          --jq '[.[] | select(.isDraft | not) | select(.name | startswith("RELEASE-"))] | sort_by(.createdAt) | reverse | .[7:] | .[].tagName' |
        while read -r OLD; do
          echo "deleting release $OLD"
          gh release delete "$OLD" --yes --cleanup-tag
        done

  cleanup:
    needs: [prepare, build, publish]
    if: always()
    runs-on: ubuntu-22.04

    steps:
    - name: Keep latest 7 workflow runs
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh run list --workflow "${{ github.workflow }}" --status completed --limit 200 --json databaseId,createdAt \
          --jq 'sort_by(.createdAt) | reverse | .[6:] | .[].databaseId' |
        while read -r ID; do
          echo "deleting workflow run $ID"
          gh run delete "$ID"
        done
