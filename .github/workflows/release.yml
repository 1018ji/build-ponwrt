name: RELEASE Builder

on:
  schedule:
    - cron: '15 17 * * *'  # UTC 17:15 = 北京时间 01:15
  workflow_dispatch:
    inputs:
      Cache:
        type: choice
        required: false
        default: 使用缓存
        options:
          - 使用缓存
          - 只读缓存
          - 重新编译
          - 不使用缓存

env:
  REPO_URL: https://github.com/1018ji/ponwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai
  # 使用缓存：恢复并保存；只读缓存：只恢复不上传；重新编译：从空缓存编译并保存；不使用缓存：全部关闭
  # 定时或外部触发没有选项，按“使用缓存”处理
  CACHE_MODE: ${{ inputs.Cache || '使用缓存' }}
  # ccache 默认按编译器文件的修改时间判断编译器是否变化，工具链重新编译后会全部不命中，改为按版本判断
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_MAXSIZE: 3G

permissions:
  contents: write
  actions: write

# DEV 与 RELEASE 共用缓存，排队依次运行，避免同时保存和清理缓存互相覆盖
concurrency:
  group: ponwrt-build
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Create draft release
      id: tag
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        COMMIT=$(git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | cut -f1)
        [ -n "$COMMIT" ] || { echo "failed to resolve $REPO_URL $REPO_BRANCH"; exit 1; }
        # 本仓库中影响固件内容的文件最后一次修改的 commit，改配置后即使上游没更新也重新发布
        CONFIG_COMMIT=$(git log -1 --format=%H -- '*.config' diy-part1.sh diy-part2.sh feeds.conf.default files)
        LAST_TAG=$(gh release list --limit 200 --json tagName,name,isDraft,createdAt \
          --jq '[.[] | select(.isDraft | not) | select(.name | startswith("RELEASE-"))] | sort_by(.createdAt) | last | .tagName // empty')
        if [ -n "$LAST_TAG" ]; then
          LAST_COMMITS=$(gh release view "$LAST_TAG" --json body --jq .body | grep -oE '[0-9a-f]{40}' | head -n2 | xargs)
          if [ "$LAST_COMMITS" = "$COMMIT $CONFIG_COMMIT" ]; then
            echo "ponwrt $COMMIT with config $CONFIG_COMMIT already released in $LAST_TAG, skip build"
            exit 0
          fi
        fi
        TAG="$(TZ="$TZ" date +%Y-%m-%d-%H-%M-%S)"
        TITLE="RELEASE-$(TZ="$TZ" date +%Y-%m-%d)"
        NOTES="ponwrt: ${REPO_URL}/commit/${COMMIT}
        config: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${CONFIG_COMMIT}"
        gh release create "$TAG" --draft --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [an7581, an7583]
    env:
      CONFIG_FILE: ${{ matrix.target }}.config

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        # 固定为 prepare 时记录的 commit，保证两个机型编译的版本与发布说明一致
        git -C openwrt checkout -q "${{ needs.prepare.outputs.commit }}"
        # tools 的 .prepared 标记文件名里带源码文件的修改时间，固定时间后缓存的工具链才能被识别
        find openwrt/tools openwrt/toolchain -exec touch -h -d @1600000000 {} +
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # 缓存在 clone 之后恢复，否则目录非空会导致 git clone 失败
    # dl 与机型无关，共用一份，按前缀恢复最新的
    - name: Restore download cache
      id: dl-cache
      if: env.CACHE_MODE != '不使用缓存'
      uses: actions/cache/restore@v4
      with:
        path: /workdir/openwrt/dl
        key: openwrt-dl-
        restore-keys: |
          openwrt-dl-

    - name: Restore compiler cache
      if: env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '只读缓存'
      uses: actions/cache/restore@v4
      with:
        path: /workdir/openwrt/.ccache
        key: openwrt-ccache-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          openwrt-ccache-${{ matrix.target }}-

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        if [ "$CACHE_MODE" != "不使用缓存" ]; then
          sed -i '/^CONFIG_DEVEL=/d; /^# CONFIG_DEVEL is not set$/d; /^CONFIG_CCACHE=/d; /^# CONFIG_CCACHE is not set$/d' .config
          printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
        fi

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        echo "dl_key=openwrt-dl-$(find dl -type f -printf '%P %s\n' | LC_ALL=C sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    # key 按 dl 文件列表计算，没有新下载的文件时跳过上传
    # 两个机型的软件包基本相同，只由 an7581 保存，避免两边各存一份后被清理步骤互相删掉
    - name: Save download cache
      if: matrix.target == 'an7581' && (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译') && steps.package.outputs.dl_key != steps.dl-cache.outputs.cache-matched-key
      uses: actions/cache/save@v4
      with:
        path: /workdir/openwrt/dl
        key: ${{ steps.package.outputs.dl_key }}

    # 工具链缓存：key 由 tools / toolchain / include 等源码和工具链相关配置算出，只接受完全匹配，源码一变就重新编译
    - name: Compute toolchain cache key
      id: toolchain
      if: env.CACHE_MODE != '不使用缓存'
      run: |
        cd openwrt
        BOARD=$(sed -n 's/^CONFIG_TARGET_BOARD="\(.*\)"$/\1/p' .config)
        SUBTARGET=$(sed -n 's/^CONFIG_TARGET_SUBTARGET="\(.*\)"$/\1/p' .config)
        HASH=$({
          git rev-parse HEAD:tools HEAD:toolchain HEAD:include HEAD:rules.mk "HEAD:target/linux/$BOARD/Makefile"
          git rev-parse "HEAD:target/linux/$BOARD/$SUBTARGET/target.mk" 2>/dev/null || true
          grep -E '^CONFIG_(ARCH|TARGET_ARCH_PACKAGES|CPU_TYPE|TARGET_OPTIMIZATION|EXTRA_OPTIMIZATION|SOFT_FLOAT|GCC_|BINUTILS_|LIBC|MUSL|GLIBC|TOOLCHAIN|EXTERNAL_TOOLCHAIN|USE_|CCACHE|DEVEL|INSTALL_|GDB|SSP_|BUILD_NLS)' .config
        } | sha256sum | cut -c1-16)
        echo "key=openwrt-toolchain-${{ matrix.target }}-$HASH" >> "$GITHUB_OUTPUT"

    - name: Restore toolchain cache
      id: toolchain-cache
      if: env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '只读缓存'
      uses: actions/cache/restore@v4
      with:
        path: |
          /workdir/openwrt/staging_dir/host
          /workdir/openwrt/staging_dir/toolchain-*
          /workdir/openwrt/build_dir/host
          /workdir/openwrt/build_dir/toolchain-*
        key: ${{ steps.toolchain.outputs.key }}

    - name: Compile tools and toolchain
      id: toolchain-build
      env:
        CACHE_HIT: ${{ steps.toolchain-cache.outputs.cache-hit }}
      run: |
        cd openwrt
        # 恢复的文件统一刷新为当前时间，避免比本次新生成的 .config 等文件旧而触发重新编译
        if [ "$CACHE_HIT" = "true" ]; then
          find staging_dir/host staging_dir/toolchain-* build_dir/host build_dir/toolchain-* -exec touch -h -d "@$(date +%s)" {} +
        fi
        make -j$(nproc) tools/install toolchain/install || make -j1 V=s tools/install toolchain/install

    - name: Remove stale toolchain cache
      if: steps.toolchain-build.outcome == 'success' && env.CACHE_MODE == '重新编译'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh cache delete "${{ steps.toolchain.outputs.key }}" || true

    # 工具链编译完立即保存，后面固件编译失败或取消也不影响
    - name: Save toolchain cache
      if: steps.toolchain-build.outcome == 'success' && (env.CACHE_MODE == '重新编译' || (env.CACHE_MODE == '使用缓存' && steps.toolchain-cache.outputs.cache-hit != 'true'))
      uses: actions/cache/save@v4
      with:
        path: |
          /workdir/openwrt/staging_dir/host
          /workdir/openwrt/staging_dir/toolchain-*
          /workdir/openwrt/build_dir/host
          /workdir/openwrt/build_dir/toolchain-*
        key: ${{ steps.toolchain.outputs.key }}

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        # 清零恢复来的统计数据，编译后显示的命中率只反映本次
        [ -x staging_dir/host/bin/ccache ] && CCACHE_DIR=$PWD/.ccache staging_dir/host/bin/ccache -z || true
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Show compiler cache statistics
      if: always() && steps.toolchain-build.outcome != 'skipped' && env.CACHE_MODE != '不使用缓存'
      run: |
        [ -x openwrt/staging_dir/host/bin/ccache ] && CCACHE_DIR=/workdir/openwrt/.ccache openwrt/staging_dir/host/bin/ccache -s || true

    # 编译失败也保存，下次重试可以复用；编译步骤没运行时不保存，避免空缓存覆盖
    - name: Save compiler cache
      if: always() && steps.toolchain-build.outcome != 'skipped' && (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译')
      uses: actions/cache/save@v4
      with:
        path: /workdir/openwrt/.ccache
        key: openwrt-ccache-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

    # 每类缓存只保留最新一份，避免超过仓库 10GB 上限后被自动淘汰
    - name: Remove old caches
      if: always() && (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译')
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        PREFIXES="openwrt-ccache-${{ matrix.target }}- openwrt-toolchain-${{ matrix.target }}-"
        [ "${{ matrix.target }}" = "an7581" ] && PREFIXES="openwrt-dl- $PREFIXES"
        for PREFIX in $PREFIXES; do
          gh cache list --key "$PREFIX" --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' |
          while read -r ID; do
            echo "deleting cache $ID ($PREFIX)"
            gh cache delete "$ID"
          done
        done

    - name: Upload firmware to release
      if: steps.compile.outputs.status == 'success' && !cancelled()
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        shopt -s nullglob
        FILES=(openwrt/bin/targets/airoha/${{ matrix.target }}/*initramfs-recovery.itb
               openwrt/bin/targets/airoha/${{ matrix.target }}/*squashfs-sysupgrade.itb)
        [ ${#FILES[@]} -gt 0 ] || { echo "no firmware found"; exit 1; }
        gh release upload "${{ needs.prepare.outputs.tag }}" "${FILES[@]}"

  publish:
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.tag != ''
    runs-on: ubuntu-22.04

    steps:
    - name: Publish or discard release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ needs.prepare.outputs.tag }}
        BUILD_RESULT: ${{ needs.build.result }}
      run: |
        # 任一机型失败都不发布，否则下次检测到 commit 已发布会跳过，失败的机型就一直没有固件
        COUNT=$(gh release view "$TAG" --json assets --jq '.assets | length')
        if [ "$BUILD_RESULT" = "success" ] && [ "$COUNT" -gt 0 ]; then
          gh release edit "$TAG" --draft=false
        else
          echo "build $BUILD_RESULT, $COUNT file(s) uploaded, deleting draft release"
          gh release delete "$TAG" --yes
          exit 1
        fi

    - name: Keep latest 7 releases
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh release list --limit 200 --json tagName,name,isDraft,createdAt \
          --jq '[.[] | select(.isDraft | not) | select(.name | startswith("RELEASE-"))] | sort_by(.createdAt) | reverse | .[7:] | .[].tagName' |
        while read -r OLD; do
          echo "deleting release $OLD"
          gh release delete "$OLD" --yes --cleanup-tag
        done

  cleanup:
    needs: [prepare, build, publish]
    if: always()
    runs-on: ubuntu-22.04

    steps:
    - name: Keep latest 7 workflow runs
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh run list --workflow "${{ github.workflow }}" --status completed --limit 200 --json databaseId,createdAt \
          --jq 'sort_by(.createdAt) | reverse | .[6:] | .[].databaseId' |
        while read -r ID; do
          echo "deleting workflow run $ID"
          gh run delete "$ID"
        done
